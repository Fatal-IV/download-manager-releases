<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #313338; --panel: #2b2d31; --raised: #383a40; --line: #3f4147;
    --ink: #dbdee1; --mute: #949ba4; --accent: #5865f2;
    --ok: #3ecf8e; --bad: #ff6b6b; --warn: #f5b14c;
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header img { width: 32px; height: 32px; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  header p { margin: 0; font-size: 11px; color: var(--mute); }
  .card { margin: 0 12px 10px; padding: 12px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row + .row { margin-top: 12px; }
  .label { font-weight: 500; }
  .hint { display: block; margin-top: 2px; font-size: 11px; color: var(--mute); font-weight: 400; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgb(62 207 142 / .2); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgb(255 107 107 / .2); }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  button.link:hover { text-decoration: underline; }
  /* Anahtar */
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--raised); border-radius: 11px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
                        border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=number] { width: 72px; padding: 6px 8px; background: var(--bg); color: var(--ink);
                       border: 1px solid var(--line); border-radius: 8px; font: inherit; text-align: right; }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; padding-top: 0; }
  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  li .when { color: var(--mute); font-size: 11px; flex: none; }
  .empty { color: var(--mute); font-size: 12px; }
  footer { padding: 0 16px 14px; font-size: 11px; color: var(--mute); }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>İndirme Yöneticisi</h1>
      <p>Tarayıcı entegrasyonu</p>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status">Uygulama denetleniyor…</span>
      </div>
      <button class="link" id="retry" hidden>Yeniden dene</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label class="label" for="on">
        İndirmeleri devral
        <span class="hint">Kapalıyken tarayıcı kendi indirir</span>
      </label>
      <label class="switch"><input type="checkbox" id="on"><span></span></label>
    </div>
    <div class="row">
      <label class="label" for="min">
        Küçük dosyaları atla
        <span class="hint">Bu boyutun altı tarayıcıda kalır (MB)</span>
      </label>
      <input type="number" id="min" min="0" step="1" value="0">
    </div>
  </div>

  <div class="card">
    <h2>Son devralınanlar</h2>
    <ul id="recent"></ul>
    <p class="empty" id="empty">Henüz bir indirme devralınmadı.</p>
  </div>

  <footer>Sağ tık menüsünden de herhangi bir bağlantıyı gönderebilirsin.</footer>
  <script src="popup.js"></script>
</body>
</html>
