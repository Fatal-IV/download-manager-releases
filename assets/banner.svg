<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="İndirme Yöneticisi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d31"/>
      <stop offset="1" stop-color="#1e1f22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b95ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bar"><rect x="120" y="268" width="960" height="10" rx="5"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="180" cy="130" r="150" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="90" r="120" fill="url(#glow)" opacity="0.5">
    <animate attributeName="cx" values="1040;980;1040" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Simge -->
  <g transform="translate(120 70)">
    <rect width="96" height="96" rx="24" fill="url(#acc)"/>
    <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -5;0 6;0 -5" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
        <path d="M48 24 V56"/>
        <path d="M33 43 L48 58 L63 43"/>
      </g>
      <path d="M30 72 H66"/>
    </g>
  </g>

  <g font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif">
    <text x="244" y="118" font-size="54" font-weight="700" fill="#f2f3f5">İndirme Yöneticisi</text>
    <text x="246" y="160" font-size="22" fill="#b5bac1">Çok bağlantılı, hızlı ve derli toplu Windows indirme yöneticisi</text>
    <g font-size="15" font-weight="600" fill="#dbdee1">
      <rect x="246" y="184" width="132" height="32" rx="16" fill="#383a40"/><text x="312" y="205" text-anchor="middle">Parçalı indirme</text>
      <rect x="388" y="184" width="104" height="32" rx="16" fill="#383a40"/><text x="440" y="205" text-anchor="middle">Hız sınırı</text>
      <rect x="502" y="184" width="118" height="32" rx="16" fill="#383a40"/><text x="561" y="205" text-anchor="middle">Zamanlayıcı</text>
      <rect x="630" y="184" width="170" height="32" rx="16" fill="#383a40"/><text x="715" y="205" text-anchor="middle">Otomatik güncelleme</text>
    </g>
  </g>

  <!-- Parçalı ilerleme çubuğu -->
  <rect x="120" y="268" width="960" height="10" rx="5" fill="#383a40"/>
  <g clip-path="url(#bar)">
    <rect x="120" y="268" width="960" height="10" fill="url(#acc)">
      <animate attributeName="width" values="0;960;960;0" keyTimes="0;0.7;0.92;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#2b2d31" stroke-width="3">
      <path d="M240 268v10M360 268v10M480 268v10M600 268v10M720 268v10M840 268v10M960 268v10"/>
    </g>
  </g>
  <g font-family="'Segoe UI Variable','Segoe UI',system-ui,sans-serif" font-size="14" fill="#949ba4">
    <text x="120" y="308">Dosya parçalara bölünür, hepsi aynı anda iner</text>
  </g>
</svg>
