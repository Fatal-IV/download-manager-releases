[package]
name = "app"
version = "0.1.10"
description = "A free, modern multi-connection download manager with browser integration"
authors = ["IK Software"]
license-file = "../LICENSE"
repository = "https://github.com/Fatal-IV/download-manager-releases"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
axum = "0.8.9"
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "io-util", "sync", "net", "process"] }
tokio-util = "0.7.19"
futures-util = "0.3.34"
thiserror = "2.0.21"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls", "http2"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
